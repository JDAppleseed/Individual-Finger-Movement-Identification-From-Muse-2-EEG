[Project]
name = EEG_Finger_Action_BCI
description = Real-time EEG-based finger and action (open/close/rest) classification with uncertainty-aware, safety-gated robotic actuation
version = 1.2
author = Jonathan Davanzo
framework = PyTorch
language = Python 3.9+
compliance = BCI_Competition_Standards, EEGLAB_Compatible

[Data]
raw_data = data/raw/
event_annotations = events.csv
event_autosave = events_autosave.csv
feature_stream = eeg_features.csv
windowed_data = eeg_windows.npz
windowed_data_csv = eeg_windows.csv
session_metadata = session_meta.json
sampling_rate_hz = 256
window_length_sec = 0.25
window_overlap = 0.20
scaler = scaler.save

[Scripts]
step1_stream_and_record = 1_stream_and_record.py
step1_event_review = 5_review_events.py
step1_event_validation = 5_validate_events.py
step1b_window_extraction = 1b_extract_windows.py
step2_training = 2_train_model.py
step3a_evaluation = 3_evaluate_model.py
step3b_deepchecks = 3b_deepchecks_evaluate.py
step3c_visualization = 3c_live_paper_figures.py
step4_reports = 4_generate_reports.py
orchestrator = run_all.py

[Models]
architecture = CNNLSTMFingerActionNet
model_type = CNN_LSTM_MultiHead
shared_encoder = enabled
heads = finger_identity, action_state
dropout = 0.3
bayesian_mode = mc_dropout
saved_weights = finger_action_model.pt

[Evaluation]
primary_metrics = accuracy, macro_f1
secondary_metrics = confusion_matrix, precision, recall
calibration_metrics = expected_calibration_error, reliability_curve
confidence_measure = max_softmax
uncertainty_measure = mc_dropout_std
mc_samples = 30
cross_validation = stratified_holdout

[Robotics_Safety]
confidence_threshold_type = online_adaptive
initial_threshold = 0.75
min_threshold = 0.55
max_threshold = 0.90
threshold_update_rate = exponential_moving_average
velocity_scaling = confidence_weighted
uncertainty_suppression = enabled
actuation_gate = enabled
fail_safe_action = no_motion

[Online_Adaptation]
enabled = true
calibration_method = temperature_scaling
adaptation_signal = post_hoc_accuracy
adaptation_window_size = 100_predictions
subject_specific = true
catastrophic_drift_protection = enabled

[Reports]
deepchecks_report = deepchecks_eeg_report.html
figures = reports/subjects/
logs = logs/experiments/
subject_registry = utils/subject_registry.json
edit_log = logs/events_edits.txt
calibration_state = logs/calibration/calibration_state_<subject>_<experiment>.json

[Environment]
os_support = Windows, macOS, Linux
device = CPU
optional_acceleration = CUDA
reproducibility_seed = 42
determinism = enabled
