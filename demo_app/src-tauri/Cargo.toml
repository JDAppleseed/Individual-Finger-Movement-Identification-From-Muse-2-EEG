[package]
name = "eeg_demo"
version = "0.1.0"
description = "EEG Demo App"
edition = "2021"

[build-dependencies]
tauri-build = "2.0"

[dependencies]
tauri = { version = "2.0", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
