name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYNPUT_BACKEND: dummy
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Environment diagnostic
        run: python scripts/diagnose_env.py

      - name: Validate reference bundle
        run: python tools/build_2m16_reference_dataset.py --check-only

      - name: Smoke inference
        run: |
          SESSION_DIR="Projects/2-M16/subjects/2-M16/sessions/combined_20260319_081200_pruned_rest_events_0_1_2"
          RUN_DIR="$SESSION_DIR/processed/models/20260319_075520"
          python tools/smoke_inference.py \
            --npz "$SESSION_DIR/processed/eeg_windows.npz" \
            --model "$RUN_DIR/finger_action_model.pt" \
            --scaler "$RUN_DIR/scaler.npz" \
            --device cpu

      - name: Compile and test
        run: |
          python -m compileall -q .
          python -m pytest -q
